# ═══════════════════════════════════════════════════════════════════════════
# AetherRuntime v0.1.0 — Netlify configuration
# ═══════════════════════════════════════════════════════════════════════════
#
# Site:    https://aetherruntime.netlify.app
# Repo:    https://github.com/gitdeeper15/aetherruntime
# Paper:   https://doi.org/10.5281/zenodo.24078477
#
# This is a static site. The site content is served from the repository root.
# ═══════════════════════════════════════════════════════════════════════════

[build]
  publish = "."
  command = ""

[build.environment]
  PYTHON_VERSION = "3.11"
  AETHERRUNTIME_VERSION = "2.0.0"
  AETHERRUNTIME_PAPER_VERSION = "0.1.0"
  AETHERRUNTIME_DOI = "10.5281/zenodo.24078477"

# ───────────────────────────────────────────────────────────────────────────
# Redirects
# ───────────────────────────────────────────────────────────────────────────

[[redirects]]
  from = "/paper"
  to = "https://doi.org/10.5281/zenodo.24078477"
  status = 302
  force = true

[[redirects]]
  from = "/doi"
  to = "https://doi.org/10.5281/zenodo.24078477"
  status = 302
  force = true

[[redirects]]
  from = "/github"
  to = "https://github.com/gitdeeper15/aetherruntime"
  status = 302
  force = true

[[redirects]]
  from = "/pypi"
  to = "https://pypi.org/project/aether-runtime/"
  status = 302
  force = true

[[redirects]]
  from = "/orcid"
  to = "https://orcid.org/0009-0003-8903-0029"
  status = 302
  force = true

[[redirects]]
  from = "/aethergit"
  to = "https://doi.org/10.5281/zenodo.23966896"
  status = 302
  force = true

[[redirects]]
  from = "/aetherflow"
  to = "https://doi.org/10.5281/zenodo.23979129"
  status = 302
  force = true

[[redirects]]
  from = "/aetherproof"
  to = "https://doi.org/10.5281/zenodo.24013124"
  status = 302
  force = true

[[redirects]]
  from = "/aethermesh"
  to = "https://doi.org/10.5281/zenodo.24038038"
  status = 302
  force = true

[[redirects]]
  from = "/aethergovern"
  to = "https://doi.org/10.5281/zenodo.24054524"
  status = 302
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/docs/figures/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"

[[headers]]
  for = "/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

[context.production.environment]
  AETHERRUNTIME_ENV = "production"

[context.deploy-preview.environment]
  AETHERRUNTIME_ENV = "preview"
